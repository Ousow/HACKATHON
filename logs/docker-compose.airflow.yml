version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# HACKATHON 2026 — Stack complète avec Airflow
# ─────────────────────────────────────────────────────────────────────────────
# Usage :
#   Première fois   : docker-compose -f docker-compose.airflow.yml up airflow-init
#   Lancer la stack : docker-compose -f docker-compose.airflow.yml up -d
#   UI Airflow      : http://localhost:8080  (admin / admin)
#   UI MinIO        : http://localhost:9001  (minioadmin / minioadmin)
#   Validation API  : http://localhost:8001/docs

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Variables du pipeline (correspondent aux Variable.get() dans le DAG)
    AIRFLOW_VAR_MINIO_ENDPOINT: minio:9000
    AIRFLOW_VAR_MINIO_USER: minioadmin
    AIRFLOW_VAR_MINIO_PASSWORD: minioadmin
    AIRFLOW_VAR_VALIDATION_SERVICE_URL: http://validation-service:8001
    AIRFLOW_VAR_OCR_SERVICE_URL: http://ocr-service:8002
    AIRFLOW_VAR_PROJECT_ROOT: /app
    AIRFLOW_VAR_PIPELINE_PROCESSED_FILES: '[]'
  volumes:
    - ./dags:/opt/airflow/dags                        # Vos DAGs
    - ./logs:/opt/airflow/logs                        # Logs Airflow
    - .:/app                                          # Tout le projet monté dans /app
    - ./dataset/output:/app/dataset/output            # Dataset généré
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - hackathon-net

services:

  # ── BASE DE DONNÉES pour Airflow ──────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    networks:
      - hackathon-net

  # ── INITIALISATION Airflow (à lancer UNE seule fois) ──────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@hackathon.local
        echo "✅ Airflow initialisé ! Login: admin / admin"
    restart: "no"

  # ── AIRFLOW WEBSERVER (UI) ────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # ── AIRFLOW SCHEDULER (exécute les DAGs) ─────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always
    # Installe les dépendances du pipeline au démarrage
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --quiet minio httpx pytesseract pdf2image pillow opencv-python-headless
        pip install --quiet -r /app/requirements.txt 2>/dev/null || true
        pip install --quiet -r /app/validation-service/requirements.txt 2>/dev/null || true
        airflow scheduler

  # ── MINIO (Datalake) ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - hackathon-net

  # ── INIT MINIO (crée les buckets raw/clean/curated) ───────────────────────
  minio-init:
    image: python:3.11-slim
    container_name: minio_init
    depends_on:
      - minio
    volumes:
      - ./Datalake:/datalake
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --quiet minio
        sleep 5
        python /datalake/init_zones.py
        echo "✅ Buckets MinIO créés : raw / clean / curated"
    environment:
      - PYTHONUNBUFFERED=1
    restart: "no"
    networks:
      - hackathon-net

  # ── VALIDATION SERVICE (FastAPI :8001) ───────────────────────────────────
  validation-service:
    container_name: validation-service
    build:
      context: ./validation-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_USER=minioadmin
      - MINIO_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hackathon-net
    depends_on:
      - minio

  # ── OCR SERVICE (optionnel, fallback local dispo) ─────────────────────────
  ocr-service:
    container_name: ocr-service
    build:
      context: ./ocr-app
      dockerfile: Dockerfile
    volumes:
      - .:/app
    networks:
      - hackathon-net
    restart: always

volumes:
  postgres_data:
  minio_data:

networks:
  hackathon-net:
    driver: bridge