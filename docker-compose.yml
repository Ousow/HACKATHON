services:

  # MINIO – Data Lake compatible toutes architectures (ARM + x86)
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Interface web → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - datalake-net

  # OCR
  ocr-service:
    container_name: ocr-service
    restart: always
    build:
      context: /ocr-app
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
    networks:
      - datalake-net

volumes:
  minio_data:

networks:
  datalake-net:
    driver: bridge
